services:
  web:
    build:
      context: .
    image: techstyle:latest
    container_name: techstyle-web
    restart: unless-stopped
    ports:
      - "5001:5001"
    volumes:
      - /opt/techstyle/data:/tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/api/products', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
