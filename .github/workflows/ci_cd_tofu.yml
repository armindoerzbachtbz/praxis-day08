name: CI/CD OpenTofu Pipeline

on:
  workflow_dispatch:
    inputs:
      cleanup_after_test:
        description: "Destroy the created AWS infrastructure after the health check"
        required: true
        default: false
        type: boolean

jobs:
  lint:
    name: Code Quality (flake8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run linter
        run: |
          flake8 tests/ conftest.py \
            --max-line-length=100 \
            --ignore=E302,W503

  test:
    name: Automated Tests (pytest)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --tb=short --cov=app --cov-report=xml --cov-report=term

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t techstyle:${{ github.sha }} .

      - name: Smoke test container
        run: |
          docker run -d --name techstyle-smoke -p 5001:5001 techstyle:${{ github.sha }}
          for i in {1..12}; do
            if curl -fsS http://localhost:5001/api/products >/tmp/products.json; then
              python -m json.tool /tmp/products.json >/dev/null
              docker logs techstyle-smoke
              exit 0
            fi
            echo "Waiting for container ($i/12)..."
            sleep 5
          done
          docker logs techstyle-smoke
          exit 1

  provision-and-deploy:
    name: Provision with OpenTofu and deploy
    runs-on: ubuntu-latest
    needs: docker-build

    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_student_name: gha-${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.8.0"

      - name: Prepare SSH key pair for EC2 access
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          test -n "$EC2_SSH_KEY" || (echo "Missing GitHub secret EC2_SSH_KEY" && exit 1)
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keygen -y -f ~/.ssh/ec2_key > /tmp/techstyle_ec2.pub

      - name: OpenTofu init
        working-directory: infra/praxisauftrag-4
        run: tofu init

      - name: OpenTofu apply
        working-directory: infra/praxisauftrag-4
        run: |
          tofu apply -auto-approve \
            -var="aws_region=${{ vars.AWS_REGION || 'us-east-1' }}"
            -var="ssh_public_key_path=/tmp/techstyle_ec2.pub"

      - name: Read infrastructure outputs
        id: tofu_outputs
        working-directory: infra/praxisauftrag-4
        run: |
          EC2_HOST="$(tofu output -raw public_ip)"
          APP_URL="$(tofu output -raw app_url)"
          echo "ec2_host=$EC2_HOST" >> "$GITHUB_OUTPUT"
          echo "app_url=$APP_URL" >> "$GITHUB_OUTPUT"
          echo "Provisioned EC2 host: $EC2_HOST"
          echo "App URL after deployment: $APP_URL"

      - name: Prepare SSH known_hosts
        env:
          EC2_HOST: ${{ steps.tofu_outputs.outputs.ec2_host }}
        run: |
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Deploy Docker Compose application
        env:
          EC2_HOST: ${{ steps.tofu_outputs.outputs.ec2_host }}
          EC2_USER: ${{ vars.EC2_USER || 'ubuntu' }}
          KEY_PATH: /home/runner/.ssh/ec2_key
          REMOTE_DIR: /home/ubuntu/techstyle
        run: |
          chmod +x deploy_docker.sh
          ./deploy_docker.sh

      - name: Health check
        env:
          EC2_HOST: ${{ steps.tofu_outputs.outputs.ec2_host }}
        run: |
          for i in {1..12}; do
            if curl -fsS "http://$EC2_HOST/api/products" >/tmp/products.json; then
              python -m json.tool /tmp/products.json >/dev/null
              echo "Health check successful"
              exit 0
            fi

            echo "Waiting for app to become ready ($i/12)..."
            sleep 5
          done

          echo "Health check failed"
          exit 1

      - name: OpenTofu destroy
        if: ${{ always() && inputs.cleanup_after_test }}
        working-directory: infra/praxisauftrag-4
        run: |
          tofu destroy -auto-approve \
            -var="aws_region=${{ vars.AWS_REGION || 'us-east-1' }}" \
            -var="ssh_public_key_path=/tmp/techstyle_ec2.pub"
