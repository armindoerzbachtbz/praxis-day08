name: CI/CD Docker Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint:
    name: Code Quality (flake8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run linter
        run: |
          flake8 tests/ conftest.py \
            --max-line-length=100 \
            --ignore=E302,W503

  test:
    name: Automated Tests (pytest)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --tb=short --cov=app --cov-report=xml --cov-report=term

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t techstyle:${{ github.sha }} .

      - name: Smoke test container
        run: |
          docker run -d --name techstyle-smoke -p 5001:5001 techstyle:${{ github.sha }}
          for i in {1..12}; do
            if curl -fsS http://localhost:5001/api/products >/tmp/products.json; then
              python -m json.tool /tmp/products.json >/dev/null
              docker logs techstyle-smoke
              exit 0
            fi
            echo "Waiting for container ($i/12)..."
            sleep 5
          done
          docker logs techstyle-smoke
          exit 1

  deploy:
    name: Deploy Docker Compose to EC2
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          test -n "$EC2_HOST" || (echo "Missing GitHub variable EC2_HOST" && exit 1)
          test -n "$EC2_SSH_KEY" || (echo "Missing GitHub secret EC2_SSH_KEY" && exit 1)

      - name: Prepare SSH key
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Deploy Docker Compose application
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER || 'ubuntu' }}
          KEY_PATH: /home/runner/.ssh/ec2_key
          REMOTE_DIR: /home/ubuntu/techstyle
        run: |
          chmod +x deploy_docker.sh
          ./deploy_docker.sh

      - name: Health check
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
        run: |
          for i in {1..12}; do
            if curl -fsS "http://$EC2_HOST:5001/api/products" >/tmp/products.json; then
              python -m json.tool /tmp/products.json >/dev/null
              echo "Health check successful"
              exit 0
            fi

            echo "Waiting for app to become ready ($i/12)..."
            sleep 5
          done

          echo "Health check failed"
          exit 1
