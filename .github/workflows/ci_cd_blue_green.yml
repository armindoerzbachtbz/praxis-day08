name: CI/CD Blue-Green Pipeline

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Blue-green action"
        required: true
        default: "deploy_only"
        type: choice
        options:
          - deploy_only
          - deploy_and_switch
          - switch_only
      deploy_target:
        description: "Target environment"
        required: true
        default: "green"
        type: choice
        options:
          - blue
          - green

jobs:
  lint:
    name: Code Quality (flake8)
    runs-on: ubuntu-latest
    if: ${{ inputs.action != 'switch_only' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run linter
        run: |
          flake8 tests/ conftest.py \
            --max-line-length=100 \
            --ignore=E302,W503

  test:
    name: Automated Tests (pytest)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --tb=short --cov=app --cov-report=xml --cov-report=term

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: ${{ inputs.action != 'switch_only' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t techstyle:${{ github.sha }} .

      - name: Smoke test container
        run: |
          docker run -d --name techstyle-smoke -p 5001:5001 techstyle:${{ github.sha }}
          for i in {1..12}; do
            if curl -fsS http://localhost:5001/api/products >/tmp/products.json; then
              python -m json.tool /tmp/products.json >/dev/null
              docker logs techstyle-smoke
              exit 0
            fi
            echo "Waiting for container ($i/12)..."
            sleep 5
          done
          docker logs techstyle-smoke
          exit 1

  deploy:
    name: ${{ inputs.action }} ${{ inputs.deploy_target }}
    runs-on: ubuntu-latest
    needs: docker-build
    if: ${{ inputs.action != 'switch_only' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select blue-green target
        env:
          DEPLOY_TARGET: ${{ inputs.deploy_target }}
          BLUE_EC2_HOST: ${{ vars.PA3_BLUE_EC2_HOST }}
          GREEN_EC2_HOST: ${{ vars.PA3_GREEN_EC2_HOST }}
          BLUE_TARGET_GROUP_ARN: ${{ vars.PA3_BLUE_TARGET_GROUP_ARN }}
          GREEN_TARGET_GROUP_ARN: ${{ vars.PA3_GREEN_TARGET_GROUP_ARN }}
        run: |
          if [ "$DEPLOY_TARGET" = "blue" ]; then
            echo "EC2_HOST=$BLUE_EC2_HOST" >> "$GITHUB_ENV"
            echo "TARGET_GROUP_ARN=$BLUE_TARGET_GROUP_ARN" >> "$GITHUB_ENV"
          else
            echo "EC2_HOST=$GREEN_EC2_HOST" >> "$GITHUB_ENV"
            echo "TARGET_GROUP_ARN=$GREEN_TARGET_GROUP_ARN" >> "$GITHUB_ENV"
          fi
          echo "TARGET_COLOR=$DEPLOY_TARGET" >> "$GITHUB_ENV"

      - name: Validate deployment configuration
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          test -n "$EC2_HOST" || (echo "Missing GitHub variable for selected EC2 host" && exit 1)
          test -n "$EC2_SSH_KEY" || (echo "Missing GitHub secret EC2_SSH_KEY" && exit 1)

      - name: Prepare SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Deploy Docker Compose application
        env:
          EC2_USER: ${{ vars.EC2_USER || 'ubuntu' }}
          KEY_PATH: /home/runner/.ssh/ec2_key
          REMOTE_DIR: /home/ubuntu/techstyle
        run: |
          chmod +x deploy_docker.sh
          ./deploy_docker.sh

      - name: Direct health check on target instance
        env:
          EC2_USER: ${{ vars.EC2_USER || 'ubuntu' }}
          KEY_PATH: /home/runner/.ssh/ec2_key
        run: |
          SERVER="$EC2_USER@$EC2_HOST"

          for i in {1..12}; do
            if ssh -i "$KEY_PATH" -o StrictHostKeyChecking=accept-new "$SERVER" \
              "curl -fsS http://localhost:5001/api/products" >/tmp/products.json; then
              python -m json.tool /tmp/products.json >/dev/null
              echo "$TARGET_COLOR environment is healthy"
              exit 0
            fi

            echo "Waiting for $TARGET_COLOR to become ready ($i/12)..."
            sleep 5
          done

          echo "$TARGET_COLOR health check failed"
          exit 1

  switch:
    name: Switch ALB to ${{ inputs.deploy_target }}
    runs-on: ubuntu-latest
    needs: deploy
    if: ${{ always() && (inputs.action == 'deploy_and_switch' || inputs.action == 'switch_only') && (inputs.action == 'switch_only' || needs.deploy.result == 'success') }}

    steps:
      - name: Select blue-green target
        env:
          DEPLOY_TARGET: ${{ inputs.deploy_target }}
          BLUE_TARGET_GROUP_ARN: ${{ vars.PA3_BLUE_TARGET_GROUP_ARN }}
          GREEN_TARGET_GROUP_ARN: ${{ vars.PA3_GREEN_TARGET_GROUP_ARN }}
        run: |
          if [ "$DEPLOY_TARGET" = "blue" ]; then
            echo "TARGET_GROUP_ARN=$BLUE_TARGET_GROUP_ARN" >> "$GITHUB_ENV"
          else
            echo "TARGET_GROUP_ARN=$GREEN_TARGET_GROUP_ARN" >> "$GITHUB_ENV"
          fi
          echo "TARGET_COLOR=$DEPLOY_TARGET" >> "$GITHUB_ENV"

      - name: Configure AWS credentials for ALB switch
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.PA3_AWS_REGION || 'us-east-1' }}

      - name: Switch ALB traffic
        env:
          ALB_LISTENER_ARN: ${{ vars.PA3_ALB_LISTENER_ARN }}
        run: |
          test -n "$ALB_LISTENER_ARN" || (echo "Missing GitHub variable PA3_ALB_LISTENER_ARN" && exit 1)
          test -n "$TARGET_GROUP_ARN" || (echo "Missing target group ARN for $TARGET_COLOR" && exit 1)

          aws elbv2 modify-listener \
            --listener-arn "$ALB_LISTENER_ARN" \
            --default-actions Type=forward,TargetGroupArn="$TARGET_GROUP_ARN"

          echo "ALB traffic switched to $TARGET_COLOR"

      - name: ALB health check
        env:
          ALB_DNS_NAME: ${{ vars.PA3_ALB_DNS_NAME }}
        run: |
          test -n "$ALB_DNS_NAME" || (echo "Missing GitHub variable PA3_ALB_DNS_NAME" && exit 1)

          for i in {1..12}; do
            if curl -fsS "http://$ALB_DNS_NAME/api/products" >/tmp/products.json; then
              python -m json.tool /tmp/products.json >/dev/null
              echo "ALB health check successful"
              exit 0
            fi

            echo "Waiting for ALB to route traffic ($i/12)..."
            sleep 5
          done

          echo "ALB health check failed"
          exit 1
