#cloud-config
package_update: true
package_upgrade: true

users:
  - default
  - name: ubuntu
    groups: sudo
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
%{ if ssh_authorized_key != "" ~}
    ssh_authorized_keys:
      - ${ssh_authorized_key}
%{ endif ~}

packages:
  - ca-certificates
  - curl
  - git
  - python3
  - python3-pip
  - python3-venv
  - sqlite3

runcmd:
  - mkdir -p /home/ubuntu/techstyle
  - chown -R ubuntu:ubuntu /home/ubuntu/techstyle
  - python3 --version
  - echo "TechStyle Praxisauftrag 1 setup completed. Python is ready; Docker is not installed." > /etc/motd
