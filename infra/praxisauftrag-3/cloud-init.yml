#cloud-config
package_update: true
package_upgrade: true

users:
  - default
  - name: ubuntu
    groups: sudo, docker
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
%{ if ssh_authorized_key != "" ~}
    ssh_authorized_keys:
      - ${ssh_authorized_key}
%{ endif ~}

packages:
  - ca-certificates
  - curl
  - git
  - python3
  - python3-pip
  - python3-venv
  - sqlite3
  - docker.io
  - docker-compose-v2

runcmd:
  - systemctl enable docker
  - systemctl start docker
  - usermod -aG docker ubuntu
  - mkdir -p /home/ubuntu/techstyle
  - mkdir -p /opt/techstyle/data
  - chown -R ubuntu:ubuntu /home/ubuntu/techstyle /opt/techstyle
  - chmod 755 /opt/techstyle
  - echo "${color}" > /opt/techstyle/color
  - docker --version
  - docker compose version
  - python3 --version
  - echo "TechStyle Praxisauftrag 3 ${color} setup completed. Docker Compose is ready." > /etc/motd

final_message: "TechStyle ${color} cloud-init setup finished."
